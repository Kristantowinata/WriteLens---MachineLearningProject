# render.yaml — Render Blueprint for WriteLens
# This file defines the service configuration for one-click deployment.

services:
  - type: web
    name: writelens
    runtime: python
    buildCommand: "./render-build.sh"
    startCommand: "cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: NODE_VERSION
        value: "20.11.0"
